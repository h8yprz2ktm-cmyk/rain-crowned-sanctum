// ---------- procedural wet stone textures ----------
function makeWetStoneTexture(size = 512) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');

  g.fillStyle = '#242a31';
  g.fillRect(0,0,size,size);

  const cells = 8;
  const cell = size / cells;
  for (let y=0; y<cells; y++) for (let x=0; x<cells; x++) {
    const n = 28 + Math.floor(Math.random()*12);
    g.fillStyle = `rgb(${n},${n+3},${n+7})`;
    g.fillRect(x*cell+2, y*cell+2, cell-4, cell-4);

    for (let i=0;i<35;i++) {
      const px = x*cell + Math.random()*cell;
      const py = y*cell + Math.random()*cell;
      const a = Math.random()*0.045;
      g.fillStyle = `rgba(255,255,255,${a})`;
      g.fillRect(px,py,1+Math.random()*2,1+Math.random()*2);
    }
  }

  g.strokeStyle = 'rgba(2,3,4,.9)';
  g.lineWidth = 3;
  for(let i=0;i<=cells;i++){
    g.beginPath(); g.moveTo(i*cell,0); g.lineTo(i*cell,size); g.stroke();
    g.beginPath(); g.moveTo(0,i*cell); g.lineTo(size,i*cell); g.stroke();
  }

  // cracks
  g.strokeStyle = 'rgba(0,0,0,.48)';
  g.lineWidth = 1;
  for(let i=0;i<30;i++){
    let x=Math.random()*size, y=Math.random()*size;
    g.beginPath(); g.moveTo(x,y);
    for(let s=0;s<5;s++){ x += (Math.random()-.5)*30; y += (Math.random()-.5)*30; g.lineTo(x,y); }
    g.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3.3,3.3);
  tex.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

function makeRoughnessTexture(size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const img = g.createImageData(size,size);
  for(let y=0;y<size;y++) for(let x=0;x<size;x++){
    const i=(y*size+x)*4;
    const wave = Math.sin(x*.11)+Math.sin(y*.07)+Math.sin((x+y)*.035);
    const puddle = wave > 1.5 ? 28 : 95 + Math.random()*55;
    img.data[i]=img.data[i+1]=img.data[i+2]=puddle;
    img.data[i+3]=255;
  }
  g.putImageData(img,0,0);
  const tex=new THREE.CanvasTexture(c);
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.repeat.set(5,5);
  return tex;
}

function shadowify(o){
  o.traverse?.(c=>{
    if(c.isMesh){
      c.castShadow = true;
      c.receiveShadow = true;
    }
  });
  return o;
}

// ---------- ruined gothic architecture ----------
function makePillar(x,z,h=7,broken=false){
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.3,.45,1.3),stoneDark);
  base.position.y=.225; g.add(base);
  const shaft = new THREE.Mesh(new THREE.BoxGeometry(.78,h,.78),stone);
  shaft.position.y=.45+h/2; g.add(shaft);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(1.15,.35,1.15),stoneDark);
  cap.position.y=.45+h+.15; g.add(cap);
  if(broken){
    shaft.scale.y = .58 + Math.random()*.18;
    const top = .45 + h*shaft.scale.y;
    shaft.position.y=.45 + h*shaft.scale.y/2;
    cap.visible=false;
    const shard = new THREE.Mesh(new THREE.ConeGeometry(.55,1.0,4),stone);
    shard.position.y=top+.35;
    shard.rotation.y=Math.random()*TAU;
    g.add(shard);
  }
  g.position.set(x,0,z);
  shadowify(g);
  scene.add(g);
  return g;
}

  g.position.set(x,0,z); g.rotation.y=rot; g.scale.setScalar(scale);
  shadowify(g); scene.add(g); return g;
}

// ---------- hanging banners ----------
const bannerVert = `
uniform float uTime;
varying vec2 vUv;
void main(){
  vUv=uv;
  vec3 p=position;
  float sway=sin(uTime*1.7 + p.y*2.4 + p.x*.7)*.085;
  sway += sin(uTime*.73 + p.y*5.0)*.025;
  p.z += sway*(1.0-uv.y);
  gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
}`;
const bannerFrag = `
varying vec2 vUv;
void main(){
  float edge=smoothstep(.02,.12,vUv.x)*smoothstep(.02,.12,1.0-vUv.x);
  vec3 c=mix(vec3(.055,.012,.017),vec3(.23,.018,.022),vUv.y);
  float sigil=1.0-smoothstep(.025,.055,abs(length(vUv-.5)-.19));
  c += vec3(.45,.03,.025)*sigil*.45;
  gl_FragColor=vec4(c,edge*.95);
  #include <colorspace_fragment>
}`;
const bannerMats=[];
function makeBanner(x,y,z,ry){
  const mat=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0}},
    vertexShader:bannerVert, fragmentShader:bannerFrag,
    side:THREE.DoubleSide, transparent:true
  });
  bannerMats.push(mat);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(2.2,4.8,8,18),mat);
  m.position.set(x,y,z); m.rotation.y=ry; scene.add(m);
}

let yaw=Math.PI*.25;

const desiredFocus=new THREE.Vector3();
let dragging=false, movedPointer=false;
let downX=0,downY=0,lastX=0,lastY=0;

function setPointer(e){
  pointer.x=(e.clientX/innerWidth)*2-1;
  pointer.y=-(e.clientY/innerHeight)*2+1;
}
renderer.domElement.addEventListener('pointerdown',e=>{
  dragging=true; movedPointer=false;
  downX=lastX=e.clientX; downY=lastY=e.clientY;
  renderer.domElement.setPointerCapture?.(e.pointerId);
});
renderer.domElement.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  if(Math.hypot(e.clientX-downX,e.clientY-downY)>5)movedPointer=true;
  if(movedPointer){
    yaw -= dx*.0062;
    pitch = clamp(pitch-dy*.0048,THREE.MathUtils.degToRad(38),THREE.MathUtils.degToRad(72));
  }
  lastX=e.clientX; lastY=e.clientY;
});
renderer.domElement.addEventListener('pointerup',e=>{
  dragging=false;
  if(!movedPointer){
    setPointer(e);
    raycaster.setFromCamera(pointer,camera);
    if(raycaster.ray.intersectPlane(groundPlane,hit)){
      const limit=11.8;
      if(hit.length()>limit) hit.setLength(limit);
      target.copy(hit); target.y=0;
      moving=true;
      marker.position.set(target.x,.028,target.z);
      markerMat.opacity=.62;
      marker.scale.setScalar(.75);
    }
  }
});
renderer.domElement.addEventListener('wheel',e=>{
  e.preventDefault();
  distance=clamp(distance+e.deltaY*.018,15,39);
},{passive:false});

// ---------- motion ----------
const clock=new THREE.Clock();
let elapsed=0;
const forward=new THREE.Vector3();
const desiredVel=new THREE.Vector3();

function updatePlayer(dt,t){
  const toTarget=target.clone().sub(player.position); toTarget.y=0;
  const dist=toTarget.length();

  if(moving && dist>.08){
    toTarget.normalize();
    const speed=dist<1.8 ? lerp(1.1,4.25,dist/1.8) : 4.25;
    desiredVel.copy(toTarget).multiplyScalar(speed);
    velocity.lerp(desiredVel,1-Math.exp(-dt*8.5));
    player.position.addScaledVector(velocity,dt);

    const ang=Math.atan2(velocity.x,velocity.z);
    player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,ang,1-Math.exp(-dt*12));

    const stride=t*10.5;
    leftLeg.rotation.x=Math.sin(stride)*.58;
    rightLeg.rotation.x=-Math.sin(stride)*.58;
    leftArm.rotation.x=-Math.sin(stride)*.35;
    rightArm.rotation.x=Math.sin(stride)*.28;
    body.position.y=1.65+Math.abs(Math.sin(stride))*0.045;
    cape.rotation.x=.13+Math.sin(t*7.5)*.035 + clamp(velocity.length()/8,0,.18);
  } else {
    moving=false;
    velocity.multiplyScalar(Math.exp(-dt*10));
    const breathe=Math.sin(t*2.2);
    body.position.y=1.65+breathe*.018;
    head.rotation.y=Math.sin(t*.6)*.08;
    leftLeg.rotation.x*=.85; rightLeg.rotation.x*=.85;
    leftArm.rotation.x*=.88; rightArm.rotation.x*=.88;
    cape.rotation.x=.08+Math.sin(t*1.7)*.035;
  }

  sword.rotation.z=-.18+Math.sin(t*2.7)*.012;
  visor.material.emissiveIntensity=2.5+Math.sin(t*3.4)*.35;

  if(markerMat.opacity>0){
    markerMat.opacity=Math.max(0,markerMat.opacity-dt*.42);
    marker.scale.addScalar(dt*.2);
  }
}

function updateCamera(dt){
  desiredFocus.copy(player.position).add(new THREE.Vector3(0,1.2,0));
  camFocus.lerp(desiredFocus,1-Math.exp(-dt*3.0));

  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  const offset=new THREE.Vector3(
    Math.sin(yaw)*cp*distance,
    sp*distance,
    Math.cos(yaw)*cp*distance
  );
  const desiredPos=camFocus.clone().add(offset);
  camera.position.lerp(desiredPos,1-Math.exp(-dt*5.0));
  camera.lookAt(camFocus);
}

function updateWorld(dt,t){
  for(const f of flames){
    const n=Math.sin(t*9+f.seed)*.5+Math.sin(t*15.7+f.seed*2)*.5;
    f.flame.scale.y=1.45+n*.16;
    f.flame.scale.x=f.flame.scale.z=.78-n*.035;
    f.flame.position.x=Math.sin(t*4+f.seed)*.035;
    f.light.intensity=7.2+Math.sin(t*11+f.seed)*1.25+Math.sin(t*3.7)*.5;
  }

  for(const mat of bannerMats) mat.uniforms.uTime.value=t;

  for(const c of crystals){
    c.g.rotation.y=t*.18+c.seed;
    c.g.position.y=Math.sin(t*.9+c.seed)*.08;
  }

  const rp=rainGeo.attributes.position.array;
  for(let i=0;i<rainCount;i++){
    rp[i*3+1]-=rainVel[i]*dt;
    rp[i*3]+=dt*1.15;
    if(rp[i*3+1]<0){
      rp[i*3+1]=22+Math.random()*8;
      rp[i*3]=(Math.random()-.5)*58+player.position.x*.1;
      rp[i*3+2]=(Math.random()-.5)*58+player.position.z*.1;
    }
  }
  rainGeo.attributes.position.needsUpdate=true;

  const ep=emberGeo.attributes.position.array;
  for(let i=0;i<emberCount;i++){
    ep[i*3+1]+=dt*(.45+((i*17)%11)*.06);
    ep[i*3]+=Math.sin(t*2.4+emberSeed[i])*dt*.12;
    ep[i*3+2]+=Math.cos(t*2.0+emberSeed[i])*dt*.10;
    if(ep[i*3+1]>5.3){
      const base=i%4; const [bx,bz]=[[-6,-5],[6,-5],[-6,5],[6,5]][base];
      ep[i*3]=bx+(Math.random()-.5)*1.0;
      ep[i*3+1]=1.15+Math.random()*.5;
      ep[i*3+2]=bz+(Math.random()-.5)*1.0;
    }
  }
  emberGeo.attributes.position.needsUpdate=true;

  for(const b of bats){
    b.a += dt*b.s;
    const flap=Math.sin(t*10+b.seed);
    b.m.position.set(Math.cos(b.a)*b.r,b.h+Math.sin(t*.8+b.seed)*1.3,Math.sin(b.a)*b.r);
    b.m.rotation.y=-b.a+.15;
    b.m.rotation.z=flap*.22;
  }
}

// FPS HUD + adaptive DPR
const fpsEl=document.getElementById('fps');
let fpsTimer=0,frames=0,qualityTimer=0,lowFpsTime=0;
function updatePerf(dt){
  frames++; fpsTimer+=dt; qualityTimer+=dt;
  if(fpsTimer>1){
    const fps=Math.round(frames/fpsTimer);
    fpsEl.textContent=`${fps} fps · ${renderer.info.render.calls} draw calls`;
    if(fps<52) lowFpsTime+=fpsTimer; else lowFpsTime=Math.max(0,lowFpsTime-fpsTimer*.5);
    frames=0;fpsTimer=0;
  }
  if(qualityTimer>3 && lowFpsTime>3 && renderer.getPixelRatio()>1.05){
    renderer.setPixelRatio(Math.max(1,renderer.getPixelRatio()-.2));
    renderer.setSize(innerWidth,innerHeight,false);
    lowFpsTime=0;
    qualityTimer=0;
  }
}

function animate(){
  const dt=Math.min(clock.getDelta(),.033);
  elapsed+=dt;
  updatePlayer(dt,elapsed);
  updateCamera(dt);
  updateWorld(dt,elapsed);
  updatePerf(dt);
  renderer.render(scene,camera);
}
renderer.setAnimationLoop(animate);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// start with a dramatic angle
player.position.set(1.5,0,2.6);
target.copy(player.position);
updateCamera(1);
</script>
